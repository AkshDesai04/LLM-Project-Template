[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for core functions and utilities
    env: Environment variable and secrets manager tests
    io: File operations and I/O utility tests
    logging: Logger and Lambda logger tests
    s3: S3 client and storage operation tests
    db: Database connectors and router tests
    concurrency: Parallel executor and multithreading tests
    document: Document and MarkItDown conversion tests
    llm: Model router, Base module, pricing, and cost tracker tests
    providers: LLM provider implementation tests (Gemini, OpenAI, Anthropic, Ollama, vLLM, Perplexity)
    media: Video frame extraction, PDF parsing, and media utility tests
